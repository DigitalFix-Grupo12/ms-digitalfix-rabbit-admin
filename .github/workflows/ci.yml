name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compilar y ejecutar tests
    runs-on: ubuntu-latest
    # Los tests no necesitan un broker: AmqpAdmin y el cliente de
    # Management API se simulan con Mockito.
    steps:
      - uses: actions/checkout@v4

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn test
        run: mvn -B -ntp test

      - name: Reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-ms-digitalfix-rabbit-admin
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
